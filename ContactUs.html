<section id="contactus">

<form method ="post" action = "file:///C:/Users/DanaM/OneDrive/%D8%B3%D8%B7%D8%AD%20%D8%A7%D9%84%D9%85%D9%83%D8%AA%D8%A8/ContactUs.html">
 <p>
                <label for="first_name">First Name:
                    <input type="text" id="first_name" name="first_name" required placeholder="Enter your first name" minlength="2" maxlength="30" pattern="[A-Za-z]+" title="Please enter only letters" />
                </label>
            </p>

            <p>
                <label for="last_name">Last Name:
                    <input type="text" id="last_name" name="last_name" required placeholder="Enter your last name" minlength="2" maxlength="30" pattern="[A-Za-z]+" title="Please enter only letters" />
                </label>
            </p>

<p>
                <label for="birth">Date of birth:
                    <input type="date" id="birth" name="birth" required 
</label>
            </p>


            <p>
                <label>Gender:</label><br>
                <label>Female
                    <input name="ge" type="radio" value="Female" required />
                </label>

                <label>Male
                    <input name="ge" type="radio" value="Male" required />
                </label>
            </p>

            <p>
                <label for="mobile">Mobile Number:
                    <input type="tel" id="mobile" name="mobile" required placeholder="Enter your mobile number" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" />
                </label>
            </p>

            <p>
                <label for="email">Email Address:
                    <input type="email" id="email" name="email" required placeholder="Enter your email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Please enter a valid email                     address" />
                </label>
            </p>

            <p>
                <label for="lang">Language
                    <select name="lang" id="lang" required>
                        <option value="english" selected>English</option>
                        <option value="arabic">Arabic</option>
                        <option value="french">French</option>
                    </select>
                </label>
            </p>

            <p>
                <label for="comments">Message:<br>
                    <textarea id="comments" name="comments" rows="4" cols="36" required placeholder="Enter your message" minlength="10" maxlength="500"></textarea>
                </label>
            </p>

            <p>
                <input type="submit" value="Send">
                <input type="reset" value="Clear">
            </p>

</form>
